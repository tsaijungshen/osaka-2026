<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2027 凱信釜山 跨年散步帖 🐾</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Huninn&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF9F0; --paper:#FFFFFF; --land:#FFF6E8; --ink:#4A3A2A; --ink2:#7D6A55;
  --tan:#FFF0D4; --tan-border:#E8CCA0;
  --blob1:#FFF0C2; --blob2:#E2F4FC; --blob3:#FFE4EC; --blob4:#E4F7DF;
  --red:#FF6B6B; --yellow:#FFD95A; --pink:#FF9EB5; --green:#7ED37E;
  --line:rgba(74,58,42,.13); --water:#C9ECFA; --mt:#D5F0C5; --mt2:#B8E2A3; --park:#E4F7DC; --road:#F9EBC8; --team2:#38B27E;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="pink"]{
  --bg:#FFF5F8; --paper:#FFFFFF; --land:#FFF0F5; --ink:#4A353B; --ink2:#85656E;
  --tan:#FFE6EE; --tan-border:#F3C1CE;
  --blob1:#FFE6EE; --blob2:#E8F4FF; --blob3:#FFF2C9; --blob4:#E6F8EE;
  --red:#FF6584; --yellow:#FFE07D; --pink:#FF8FB1; --green:#7ED386;
  --road:#FFEBF0;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Huninn","Zen Maru Gothic","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  line-height:1.6; -webkit-font-smoothing:antialiased;
  background-image:url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' width='200' height='200'%3E%3Cg fill='%23FFD166' opacity='.42'%3E%3Cpath d='M32 22l3.5 7.5 7.5 3.5-7.5 3.5-3.5 7.5-3.5-7.5-7.5-3.5 7.5-3.5z'/%3E%3Cpath d='M150 95l2.5 5.5 5.5 2.5-5.5 2.5-2.5 5.5-2.5-5.5-5.5-2.5 5.5-2.5z'/%3E%3Cpath d='M85 160l2 4 4 2-4 2-2 4-2-4-4-2 4-2z'/%3E%3Ccircle cx='110' cy='45' r='2.5'/%3E%3Ccircle cx='45' cy='135' r='2'/%3E%3C/g%3E%3Cg fill='%23FF9EB5' opacity='.38'%3E%3Ccircle cx='170' cy='35' r='3'/%3E%3Ccircle cx='25' cy='85' r='2.5'/%3E%3Cpath d='M165 165l2.5 5 5 2.5-5 2.5-2.5 5-2.5-5-5-2.5 5-2.5z'/%3E%3C/g%3E%3Cg fill='%2389CFF0' opacity='.35'%3E%3Ccircle cx='70' cy='25' r='2.2'/%3E%3Ccircle cx='130' cy='175' r='2.5'/%3E%3C/g%3E%3C/svg%3E");
}
a{color:inherit}
.wrap{max-width:1220px;margin:0 auto;padding:18px 16px 48px}

/* 頂部橫幅與角色立體陰影動畫 */
header.top{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;
  margin:4px 4px 16px;padding:14px 20px;
  background:linear-gradient(135deg, var(--tan) 0%, #FFFDF9 100%);
  border:2.5px solid var(--ink);border-radius:24px;
  box-shadow:0 5px 0 rgba(74,58,42,.1);position:relative;overflow:hidden;
}
.title{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.title-mascots{display:flex;align-items:center;margin-right:2px}
.title-mascots span{
  font-size:36px; margin-right:-4px; 
  filter: drop-shadow(0 2px 0 #FFF) drop-shadow(2px 0 0 #FFF) drop-shadow(-2px 0 0 #FFF) drop-shadow(0 -2px 0 #FFF) drop-shadow(0 4px 4px rgba(0,0,0,0.15));
  transition:transform .2s; cursor:pointer;
}
.title-mascots span:hover{transform:translateY(-5px) scale(1.1) rotate(-5deg)}
.title h1{margin:0;font-family:"Zen Maru Gothic","Huninn",sans-serif;font-weight:900;font-size:clamp(24px,4.2vw,38px);line-height:1.18;letter-spacing:.02em}
.title p{margin:3px 0 0;color:var(--ink2);font-size:14.5px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;box-shadow:0 2px 0 rgba(74,58,42,.12);transition:all .15s}
.chip:hover{background:var(--yellow);transform:translateY(-1px)}

/* 天數標籤紙卡 */
nav.days{display:flex;gap:10px;overflow-x:auto;padding:4px 4px 14px;scrollbar-width:thin}
.ticket{
  flex:0 0 auto;position:relative;min-width:124px;padding:10px 16px;border:2.5px solid var(--ink);border-radius:14px;
  background:var(--paper);color:var(--ink);font:inherit;text-align:left;cursor:pointer;
  box-shadow:0 3px 0 rgba(74,58,42,.1);transition:transform .15s,background .15s;
}
.ticket:hover{transform:translateY(-2px);background:var(--blob1)}
.ticket b{display:flex;align-items:center;gap:6px;font-family:"Zen Maru Gothic","Huninn",sans-serif;font-weight:900;font-size:18px;line-height:1.15}
.ticket span{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px}
.ticket.active{background:var(--yellow);color:#4A3A2A;transform:translateY(-2px)}
.ticket.active span{color:#4A3A2A;font-weight:700}

/* 排版版面 */
.page{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:880px){.page{grid-template-columns:1fr}}
.day-head{
  grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;
  padding:12px 18px;background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;
  box-shadow:0 4px 0 rgba(74,58,42,.08);
}
.day-head h2{margin:0;display:flex;align-items:center;gap:8px;font-family:"Zen Maru Gothic","Huninn",sans-serif;font-weight:900;font-size:clamp(20px,3vw,28px)}
.day-head .meta{color:var(--ink2);font-size:14.5px;width:100%}

/* 手帳插畫風地圖卡片 */
.mapcard{background:var(--paper);border:3px solid var(--ink);border-radius:24px;overflow:hidden;position:relative;box-shadow:0 6px 0 rgba(74,58,42,.1)}
.map-canvas{
  height:320px; background:var(--land); position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.map-bg-grid{
  position:absolute; width:100%; height:100%;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 20px 20px; opacity: 0.5;
}
.map-sea{
  position:absolute; bottom:0; width:100%; height:110px; background:var(--water);
  border-top: 3px dashed var(--ink); animation: wave 4s ease-in-out infinite alternate;
}
@keyframes wave { 0% { transform: translateY(0) scaleY(1); } 100% { transform: translateY(5px) scaleY(1.02); } }
.map-marker{
  position:absolute; display:flex; flex-direction:column; align-items:center;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.marker-pin{
  font-size:28px; filter:drop-shadow(0 2px 2px rgba(0,0,0,0.2));
  animation: bounce 2s infinite alternate;
}
@keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }
.marker-label{
  background:var(--paper); border:2px solid var(--ink); padding:2px 8px;
  border-radius:8px; font-size:12px; font-weight:700; white-space:nowrap; margin-top:2px;
  box-shadow:0 2px 0 rgba(0,0,0,0.1);
}

/* 互動式模擬時間軸 */
.clockbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px;border-top:3px solid var(--ink);background:var(--paper)}
.clock{font-family:"Zen Maru Gothic","Huninn",sans-serif;font-weight:900;font-size:30px;line-height:1;min-width:92px;font-variant-numeric:tabular-nums}
.status{flex:1 1 200px;font-size:15px;color:var(--ink2);font-weight:700}
.ctrl{display:flex;align-items:center;gap:8px;width:100%}
.play{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);background:var(--red);color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 0 rgba(74,58,42,.2);font-weight:bold;}
.play:hover{transform:scale(1.05)}
input[type=range]{flex:1;accent-color:var(--red);height:28px;cursor:pointer}

/* 行程時間軸樣式 */
.timeline{display:flex;flex-direction:column;gap:14px;position:relative;padding-left:16px}
.timeline::before{
  content:''; position:absolute; left:4px; top:8px; bottom:8px; width:3px;
  background:var(--ink); opacity:0.15;
}
.spot-card{
  position:relative; background:var(--paper); border:2.5px solid var(--ink); border-radius:16px;
  padding:14px 16px; box-shadow:0 4px 0 rgba(74,58,42,.06); transition: all 0.2s;
}
.spot-card.highlight-spot {
  border-color: var(--red); background: var(--blob3); transform: scale(1.01);
  box-shadow: 0 4px 12px rgba(255, 107, 107, 0.15);
}
.spot-card::before{
  content:''; position:absolute; left:-16px; top:22px; width:10px; height:10px;
  background:var(--paper); border:2px solid var(--ink); border-radius:50%; transition: all 0.2s;
}
.spot-card.highlight-spot::before {
  background: var(--red); transform: scale(1.3);
}
.spot-time{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:15px;color:var(--red)}
.spot-name{font-weight:900;font-size:18px;margin:2px 0 4px}
.spot-detail{font-size:14px;color:var(--ink2);white-space:pre-line}

.sidebar-box{
  background:var(--paper); border:2.5px solid var(--ink); border-radius:20px;
  padding:16px; box-shadow:0 4px 0 rgba(74,58,42,.06); margin-bottom:16px;
}
.sidebar-box h3{margin:0 0 10px 0; font-family:"Zen Maru Gothic",sans-serif; font-weight:900; font-size:18px}
.sidebar-box ul{margin:0; padding-left:20px; font-size:14px}
.sidebar-box li{margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title">
      <div class="title-mascots">
        <span onclick="triggerMascot('chiikawa')">🐱</span>
        <span onclick="triggerMascot('hachiware')">🐰</span>
        <span onclick="triggerMascot('usagi')">🐻</span>
      </div>
      <div>
        <h1>2027 凱信釜山 跨年散步帖 🐾</h1>
        <p>吉依卡哇與夥伴們陪你走過精彩的每一天 ✨ (完整動畫豪華版)</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="chip" id="themeBtn" onclick="toggleTheme()">🌸 切換粉嫩主題</button>
    </div>
  </header>

  <nav class="days" id="daysNav"></nav>

  <main class="page">
    <!-- 左側：動態行程線 -->
    <div class="timeline-wrapper">
      <div class="day-head">
        <h2 id="dayTitle">正在翻開手帳...</h2>
