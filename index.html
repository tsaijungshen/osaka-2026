<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2027 凱信釜山 跨年散步帖 🐾</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Huninn&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF9F0; --paper:#FFFFFF; --land:#FFF6E8; --ink:#4A3A2A; --ink2:#7D6A55;
  --tan:#FFF0D4; --tan-border:#E8CCA0;
  --blob1:#FFF0C2; --blob2:#E2F4FC; --blob3:#FFE4EC; --blob4:#E4F7DF;
  --red:#FF6B6B; --yellow:#FFD95A; --pink:#FF9EB5; --green:#7ED37E;
  --line:rgba(74,58,42,.13); --water:#C9ECFA; --mt:#D5F0C5; --mt2:#B8E2A3; --park:#E4F7DC; --road:#F9EBC8; --team2:#38B27E;
  color-scheme:light;
  box-sizing:border-box;
}
:root[data-theme="pink"]{
  --bg:#FFF5F8; --paper:#FFFFFF; --land:#FFF0F5; --ink:#4A353B; --ink2:#85656E;
  --tan:#FFE6EE; --tan-border:#F3C1CE;
  --blob1:#FFE6EE; --blob2:#E8F4FF; --blob3:#FFF2C9; --blob4:#E6F8EE;
  --red:#FF6584; --yellow:#FFE07D; --pink:#FF8FB1; --green:#7ED386;
  --road:#FFEBF0;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Huninn","Zen Maru Gothic","PingFang TC",sans-serif;
  line-height:1.6; -webkit-font-smoothing:antialiased;
  background-image:url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' width='200' height='200'%3E%3Cg fill='%23FFD166' opacity='.42'%3E%3Cpath d='M32 22l3.5 7.5 7.5 3.5-7.5 3.5-3.5 7.5-3.5-7.5-7.5-3.5 7.5-3.5z'/%3E%3Cpath d='M150 95l2.5 5.5 5.5 2.5-5.5 2.5-2.5 5.5-2.5-5.5-5.5-2.5 5.5-2.5z'/%3E%3C/g%3E%3C/svg%3E");
}
.wrap{max-width:1220px;margin:0 auto;padding:18px 16px 48px}

/* 頂部橫幅與角色立體白邊濾鏡 */
header.top{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;
  margin:4px 4px 16px;padding:14px 20px;
  background:linear-gradient(135deg, var(--tan) 0%, #FFFDF9 100%);
  border:2.5px solid var(--ink);border-radius:24px;
  box-shadow:0 5px 0 rgba(74,58,42,.1);position:relative;overflow:hidden;
}
.title{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.title-mascots{display:flex;align-items:center;margin-right:2px}
.title-mascots svg{
  width:48px;height:48px;margin-right:-8px;
  filter: drop-shadow(0 1.5px 0 #FFFFFF) drop-shadow(0 -1.5px 0 #FFFFFF) drop-shadow(1.5px 0 0 #FFFFFF) drop-shadow(-1.5px 0 0 #FFFFFF) drop-shadow(0 3px 3px rgba(74,58,42,.18));
  transition:transform .2s; cursor:pointer;
}
.title-mascots svg:hover{transform:translateY(-5px) rotate(-5deg) scale(1.1)}
.title h1{margin:0;font-family:"Zen Maru Gothic","Huninn",sans-serif;font-weight:900;font-size:clamp(24px,4.2vw,36px);line-height:1.2}
.title p{margin:3px 0 0;color:var(--ink2);font-size:14.5px}

.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 rgba(74,58,42,.12);transition:all .15s}
.chip:hover{background:var(--yellow);transform:translateY(-1px)}

/* 天數標籤頁 */
nav.days{display:flex;gap:10px;overflow-x:auto;padding:4px 4px 14px;scrollbar-width:thin}
.ticket{
  flex:0 0 auto;position:relative;min-width:124px;padding:10px 16px;border:2.5px solid var(--ink);border-radius:14px;
  background:var(--paper);color:var(--ink);font:inherit;text-align:left;cursor:pointer;
  box-shadow:0 3px 0 rgba(74,58,42,.1);transition:transform .15s,background .15s;
}
.ticket b{display:flex;align-items:center;gap:6px;font-family:"Zen Maru Gothic","Huninn",sans-serif;font-weight:900;font-size:18px}
.ticket span{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px}
.ticket.active{background:var(--yellow);transform:translateY(-2px)}
.ticket.active span{font-weight:700;color:var(--ink)}

/* 排版版面 */
.page{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:880px){.page{grid-template-columns:1fr}}
.day-head{
  grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;
  padding:12px 18px;background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;
  box-shadow:0 4px 0 rgba(74,58,42,.08);
}
.day-head h2{margin:0;font-family:"Zen Maru Gothic","Huninn",sans-serif;font-weight:900;font-size:26px}
.day-head .meta{color:var(--ink2);font-size:14.5px;width:100%}

/* 模擬地圖卡片架構 */
.mapcard{background:var(--paper);border:3px solid var(--ink);border-radius:24px;overflow:hidden;position:relative;box-shadow:0 6px 0 rgba(74,58,42,.1)}
.map-canvas{
  height:320px; background:var(--land); position:relative; overflow:hidden;
}
.map-bg-grid{
  position:absolute; width:100%; height:100%;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 20px 20px; opacity: 0.4;
}
.map-sea{
  position:absolute; bottom:0; width:100%; height:100px; background:var(--water);
  border-top: 3px dashed var(--ink);
}
.map-marker{
  position:absolute; display:flex; flex-direction:column; align-items:center;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.marker-pin{
  font-size:28px; filter:drop-shadow(0 2px 2px rgba(0,0,0,0.15));
}
.marker-label{
  background:var(--paper); border:2px solid var(--ink); padding:2px 6px;
  border-radius:8px; font-size:11px; font-weight:700; white-space:nowrap; margin-top:2px;
}

/* 底部時間軸控條 */
.clockbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px;border-top:3px solid var(--ink);background:var(--paper)}
.clock{font-family:"Zen Maru Gothic","Huninn",sans-serif;font-weight:900;font-size:30px;min-width:92px}
.status{flex:1 1 200px;font-size:14.5px;color:var(--ink2);font-weight:700}
.ctrl{display:flex;align-items:center;gap:8px;width:100%}
.play{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);background:var(--red);color:#fff;font-size:16px;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 0 rgba(74,58,42,.2)}
input[type=range]{flex:1;accent-color:var(--red);height:28px;cursor:pointer}

/* 行程線樣式 */
.timeline{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.spot-card{
  background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;
  padding:14px;box-shadow:0 4px 0 rgba(74,58,42,.06);transition: all 0.2s;
}
.spot-card.highlight-spot {
  border-color: var(--red); background: var(--blob3); transform: scale(1.01);
}
.spot-time{font-weight:900;color:var(--red);font-size:15px}
.spot-name{font-weight:900;font-size:18px;margin:2px 0}
.spot-detail{color:var(--ink2);font-size:14px;white-space:pre-line}

.sidebar-box{
  background:var(--paper); border:2.5px solid var(--ink); border-radius:20px;
  padding:16px; box-shadow:0 4px 0 rgba(74,58,42,.06); margin-bottom:14px;
}
.sidebar-box h3{margin:0 0 8px 0; font-size:17px; font-weight:900}
.sidebar-box ul{margin:0; padding-left:18px; font-size:13.5px}
</style>
</head>
<body>
<div class="wrap">

    <div class="title">

      </div>
      <div>
        <h1>2027 凱信釜山 跨年散步帖 🐾</h1>

      </div>

    <div class="top-actions">
      <button class="chip" id="themeBtn" onclick="toggleTheme()">🌸 切換粉嫩手帳</button>

  </header>
