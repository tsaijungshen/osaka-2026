.ticket:hover{transform:translateY(-2px);background:var(--blob1)}

.ticket span{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px}
.ticket.active{background:var(--yellow);color:#4A3A2A;transform:translateY(-2px)}
